services:
  frontend:
    build: ./frontend
    container_name: sabana_frontend
    ports:
      - "80:80"
    restart: "no"
    depends_on:
      backend:
        condition: service_started
    networks:
      - sabana_network

  backend:
    build: ./backend
    container_name: sabana_backend
    ports:
      - "8000:80"
      - "443:443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./backend:/app
      - ./backend/Caddyfile:/etc/caddy/Caddyfile
    environment:
      - TZ=UTC
      - APP_TIMEZONE=UTC
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USER}
      - DB_DATABASE=${DB_NAME}
      - ELASTICSEARCH_PASSWORD=${ES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SERVER_NAME=:80
      - CADDY_GLOBAL_OPTIONS=auto_https disable_redirects
      - CHOKIDAR_USEPOLLING=true
    env_file:
      - ./backend/.env
    command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --admin-port=2019 --watch --poll
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      backend_init:
        condition: service_completed_successfully
    networks:
      - sabana_network

  backend_init:
    build: ./backend
    container_name: sabana_backend_init
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USER}
      - DB_DATABASE=${DB_NAME}
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sabana_network
      
  queue_worker:
    build: ./backend
    container_name: sabana_queue_worker
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USER}
      - DB_DATABASE=${DB_NAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-jobs=100 --max-time=3600
    restart: "unless-stopped"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend_init:
        condition: service_completed_successfully
    networks:
      - sabana_network

  postgres:
    image: postgres:15-alpine
    container_name: sabana_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    expose:
      - "5432"
    volumes:
      - sabana_pg_data:/var/lib/postgresql/data
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sabana_network

  redis:
    image: redis:7.2-alpine
    container_name: sabana_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 64mb --maxmemory-policy volatile-lru
    expose:
      - "6379"
    volumes:
      - sabana_redis_data:/data
    restart: "no"
    networks:
      - sabana_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: sabana_search
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD}
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    deploy:
      resources:
        limits:
          memory: 512M
    expose:
      - "9200"
    volumes:
      - sabana_es_data:/usr/share/elasticsearch/data
    restart: "no"
    networks:
      - sabana_network

  scheduler:
    build: ./backend
    container_name: sabana_scheduler
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USER}
      - DB_DATABASE=${DB_NAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
    command: >
      sh -c "trap 'exit 0' SIGTERM SIGINT; while true; do php artisan schedule:run --verbose --no-interaction; sleep 60 & wait $!; done"
    restart: "unless-stopped"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend_init:
        condition: service_completed_successfully
      ocr_service:
        condition: service_started
      nlp_service:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "artisan", "schedule:run", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sabana_network

  ocr_service:
    build: ./machine-learning/ocr
    container_name: sabana_ocr
    restart: "no"
    expose:
      - "5001"
    depends_on:
      redis:
        condition: service_started
    networks:
      - sabana_network

  nlp_service:
    build: ./machine-learning/nlp
    container_name: sabana_nlp
    restart: "no"
    expose:
      - "5002"
    depends_on:
      redis:
        condition: service_started
    networks:
      - sabana_network

networks:
  sabana_network:
    driver: bridge

volumes:
  sabana_pg_data:
  sabana_redis_data:
  sabana_es_data: